spring.config.import=optional:file:.env[.properties]

spring.application.name=aquaflow
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquaflow}
spring.datasource.username=${DB_USER:aquaflow}
spring.datasource.password=${DB_PASSWORD:aquaflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

aquaflow.booking.session-generation-weeks-ahead=4
aquaflow.school.name=AquaFlow Escola de Natação
aquaflow.school.address=Av. das Piscinas, 123 - Centro
aquaflow.school.phone=(83) 99999-0000