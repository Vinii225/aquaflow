spring.config.import=optional:file:.env[.properties]

spring.application.name=aquaflow
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquaflow}
spring.datasource.username=${DB_USER:aquaflow}
spring.datasource.password=${DB_PASSWORD:aquaflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# Banco vazio: roda todas as migrations. Banco ja populado sem historico do Flyway
# (ex.: o de homologacao no Render, criado manualmente com V1 + V2): marca como
# versao 2 e aplica so as novas (V3, V4, ...).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:2}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

aquaflow.booking.session-generation-weeks-ahead=4
# .properties e lido em ISO-8859-1: acentos precisam ir como escape unicode
aquaflow.school.name=AquaFlow Escola de Nata\u00e7\u00e3o
aquaflow.school.address=Av. das Piscinas, 123 - Centro
aquaflow.school.phone=(83) 99999-0000
# Desempenho: gzip nas respostas de texto e cache longo nos estáticos.
# O nome do CSS ganha o hash do conteúdo (aquaflow-<hash>.css), então um deploy
# novo troca a URL e o navegador nunca fica com a versão antiga.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/svg+xml,application/json
server.compression.min-response-size=1024
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
