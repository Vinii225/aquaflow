spring:
  application:
    name: aquaflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquaflow}
    username: ${DB_USER:aquaflow}
    password: ${DB_PASSWORD:aquaflow}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

aquaflow:
  booking:
    session-generation-weeks-ahead: 4
  school:
    name: "AquaFlow Escola de Natação"
    address: "Av. das Piscinas, 123 - Centro"
    phone: "(83) 99999-0000"
