<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mensagens', null)}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h4 mb-0">Mensagens de interessados</h1>
      <p class="text-muted small mb-0">
        Contatos enviados pela página de planos. Encaminhe para o dono da escola ou a secretaria.
      </p>
    </div>
    <span class="badge rounded-pill badge-status-new fs-6" th:if="${newCount > 0}"
          th:text="${newCount} + (${newCount} == 1 ? ' nova' : ' novas')">2 novas</span>
  </div>

  <ul class="nav nav-pills mb-3 gap-1">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${status == null} ? 'active'" th:href="@{/plataforma/mensagens}">Todas</a>
    </li>
    <li class="nav-item" th:each="s : ${statuses}">
      <a class="nav-link" th:classappend="${status == s} ? 'active'"
         th:href="@{/plataforma/mensagens(status=${s})}" th:text="${s.label} + 's'">Novas</a>
    </li>
  </ul>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Recebida em</th><th>Interessado</th><th>Escola</th><th>Plano</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="m : ${messages.content}" th:classappend="${m.status.name() == 'NEW'} ? 'fw-semibold'">
          <td class="text-nowrap" th:text="${#temporals.format(m.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
          <td>
            <div th:text="${m.name}"></div>
            <div class="small text-muted fw-normal" th:text="${m.email}"></div>
          </td>
          <td th:text="${m.tenant.name}"></td>
          <td th:text="${m.plan != null} ? ${m.plan.name} : 'Dúvida geral'"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(m.status)}" th:text="${m.status.label}"></span></td>
          <td class="text-end">
            <a class="btn btn-sm btn-primary" th:href="@{/plataforma/mensagens/{id}(id=${m.id})}">Abrir</a>
          </td>
        </tr>
        <tr th:if="${messages.empty}"><td colspan="6" class="text-center text-muted py-4">Nenhuma mensagem por aqui.</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="mt-3" th:if="${messages.totalPages > 1}">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, messages.totalPages - 1)}"
          th:classappend="${i == messages.number} ? 'active'">
        <a class="page-link" th:href="@{/plataforma/mensagens(page=${i},status=${status})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
