<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-aquaflow mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">AquaFlow</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>

        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/pools}">Piscinas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/classes}">Turmas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/schedules}">Grade</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/sessions}">Aulas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/subscriptions}">Assinaturas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/invoices}">Faturas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/transactions}">Caixa</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SCHOOL_ADMIN')">
          <a class="nav-link" th:href="@{/admin/users}">Usuários</a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('TEACHER')">
          <a class="nav-link" th:href="@{/teacher/sessions}">Minhas aulas</a>
        </li>

        <li class="nav-item" sec:authorize="hasRole('STUDENT')">
          <a class="nav-link" th:href="@{/student/sessions}">Aulas disponíveis</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('STUDENT')">
          <a class="nav-link" th:href="@{/student/bookings}">Minhas reservas</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('STUDENT')">
          <a class="nav-link" th:href="@{/student/invoices}">Minhas faturas</a>
        </li>
      </ul>

      <ul class="navbar-nav">
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <span class="nav-link" sec:authentication="name">usuário</span>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
          </form>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="nav-link" th:href="@{/login}">Entrar</a>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="nav-link" th:href="@{/register}">Criar conta</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
