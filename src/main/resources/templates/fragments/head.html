<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  <head> comum a todas as páginas. Uso:
    <head th:replace="~{fragments/head :: head('Planos', 'Descrição para buscadores')}"></head>
  Passe null na descrição em páginas internas (admin, aluno, professor).
-->
<head th:fragment="head(title, description)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" th:if="${description}" th:content="${description}">
  <meta name="theme-color" content="#0E7490">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
  <title th:text="${title} + ' · AquaFlow'">AquaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
</html>
