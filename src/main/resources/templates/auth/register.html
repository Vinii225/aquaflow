<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · AquaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body class="home-page">
<div class="split-auth row g-0">
  <div class="col-md-6 split-auth-media d-flex align-items-end p-5"
       th:style="'background-image: url(' + @{/img/gallery-dive.jpg} + ')'">
    <div class="split-auth-media-content">
      <h2 class="fw-bold">Venha nadar com a gente</h2>
      <p class="mb-0">Crie sua conta e reserve suas aulas em poucos cliques.</p>
    </div>
  </div>

  <div class="col-md-6 split-auth-form d-flex align-items-center justify-content-center p-4">
    <div style="max-width: 380px; width: 100%;">
      <a th:href="@{/}" class="split-auth-brand d-inline-flex align-items-center gap-2 mb-4">
        <i class="bi bi-water"></i> AquaFlow
      </a>

      <h1 class="h4 mb-3">Criar conta de aluno</h1>

      <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="mb-3">
          <label class="form-label" for="name">Nome</label>
          <input type="text" class="form-control" id="name" th:field="*{name}"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" class="form-control" id="email" th:field="*{email}"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Senha</label>
          <input type="password" class="form-control" id="password" th:field="*{password}"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Confirmar senha</label>
          <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                 th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Criar conta</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Já tem conta? <a th:href="@{/login}">Entrar</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
