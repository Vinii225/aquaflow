<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · AquaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body class="home-page">
<div class="split-auth row g-0">
  <div class="col-md-6 split-auth-media d-flex align-items-end p-5"
       th:style="'background-image: url(' + @{/img/hero-pool.jpg} + ')'">
    <div class="split-auth-media-content">
      <h2 class="fw-bold">Bem-vindo de volta</h2>
      <p class="mb-0">Acesse sua turma, suas reservas e suas faturas em um só lugar.</p>
    </div>
  </div>

  <div class="col-md-6 split-auth-form d-flex align-items-center justify-content-center p-4">
    <div style="max-width: 380px; width: 100%;">
      <a th:href="@{/}" class="split-auth-brand d-inline-flex align-items-center gap-2 mb-4">
        <i class="bi bi-water"></i> AquaFlow
      </a>

      <h1 class="h4 mb-3">Entrar</h1>

      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
      <div class="alert alert-danger" th:if="${param.error}">E-mail ou senha inválidos.</div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">E-mail</label>
          <input type="email" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Senha</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Não tem conta? <a th:href="@{/register}">Criar conta</a>
      </p>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
