<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas aulas · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <h1 class="h4 mb-3">Minhas aulas (próximas 2 semanas)</h1>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Data</th><th>Horário</th><th>Turma</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="s : ${sessions}">
          <td th:text="${#temporals.format(s.date, 'dd/MM/yyyy')}"></td>
          <td th:text="${#temporals.format(s.startTime, 'HH:mm')} + ' às ' + ${#temporals.format(s.endTime, 'HH:mm')}"></td>
          <td th:text="${s.swimClass.name}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(s.status)}" th:text="${s.status}"></span></td>
          <td class="text-end">
            <a th:if="${s.status.name() == 'SCHEDULED'}" class="btn btn-sm btn-primary"
               th:href="@{/teacher/sessions/{id}/attendance(id=${s.id})}">Fazer chamada</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(sessions)}"><td colspan="5" class="text-center text-muted py-4">Nenhuma aula nos próximos dias.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
