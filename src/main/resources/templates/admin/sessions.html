<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aulas · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Aulas agendadas</h1>
    <form th:action="@{/admin/sessions/generate}" method="post">
      <button type="submit" class="btn btn-accent">Gerar próximas <span th:text="${weeksAhead}"></span> semanas</button>
    </form>
  </div>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Data</th><th>Horário</th><th>Turma</th><th>Professor</th><th>Vagas</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr th:each="s : ${sessions.content}">
          <td th:text="${#temporals.format(s.date, 'dd/MM/yyyy')}"></td>
          <td th:text="${#temporals.format(s.startTime, 'HH:mm')} + ' às ' + ${#temporals.format(s.endTime, 'HH:mm')}"></td>
          <td th:text="${s.swimClass.name}"></td>
          <td th:text="${s.teacher.name}"></td>
          <td th:text="${s.limitStudents}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(s.status)}" th:text="${s.status}"></span></td>
        </tr>
        <tr th:if="${sessions.empty}"><td colspan="6" class="text-center text-muted py-4">Nenhuma aula gerada ainda.</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="mt-3" th:if="${sessions.totalPages > 1}">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, sessions.totalPages - 1)}"
          th:classappend="${i == sessions.number} ? 'active'">
        <a class="page-link" th:href="@{/admin/sessions(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
