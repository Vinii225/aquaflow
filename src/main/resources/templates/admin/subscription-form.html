<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container" style="max-width: 560px;">
  <div class="card card-aquaflow p-4">
    <h1 class="h4 mb-3" th:text="${subscription.id} ? 'Editar assinatura' : 'Nova assinatura'">Assinatura</h1>

    <form th:action="@{/admin/subscriptions}" th:object="${subscription}" method="post">
      <input type="hidden" th:field="*{id}">

      <div class="mb-3">
        <label class="form-label" for="student">Aluno</label>
        <select class="form-select" id="student" th:field="*{student}">
          <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}"></option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="planName">Nome do plano</label>
        <input type="text" class="form-control" id="planName" th:field="*{planName}" placeholder="Ex.: Mensal 2x/semana"
               th:classappend="${#fields.hasErrors('planName')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('planName')}" th:errors="*{planName}"></div>
      </div>

      <div class="row">
        <div class="col mb-3">
          <label class="form-label" for="monthlyFee">Valor mensal (R$)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="monthlyFee" th:field="*{monthlyFee}"
                 th:classappend="${#fields.hasErrors('monthlyFee')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('monthlyFee')}" th:errors="*{monthlyFee}"></div>
        </div>
        <div class="col mb-3">
          <label class="form-label" for="dueDay">Dia de vencimento</label>
          <input type="number" min="1" max="31" class="form-control" id="dueDay" th:field="*{dueDay}"
                 th:classappend="${#fields.hasErrors('dueDay')} ? 'is-invalid'">
          <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDay')}" th:errors="*{dueDay}"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="startDate">Início</label>
        <input type="date" class="form-control" id="startDate" th:field="*{startDate}"
               th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" th:field="*{status}">
          <option value="ACTIVE">Ativa</option>
          <option value="PAUSED">Pausada</option>
          <option value="CANCELED">Cancelada</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/subscriptions}">Cancelar</a>
      </div>
    </form>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
