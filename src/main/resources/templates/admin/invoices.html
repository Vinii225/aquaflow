<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Faturas', null)}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Faturas</h1>
    <form th:action="@{/admin/invoices/generate}" method="post">
      <button type="submit" class="btn btn-accent">Gerar faturas do mês</button>
    </form>
  </div>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Aluno</th><th>Referência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="i : ${invoices.content}">
          <td th:text="${i.subscription.student.name}"></td>
          <td th:text="${#temporals.format(i.referenceMonth, 'MM/yyyy')}"></td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(i.amount, 1, 2)}"></td>
          <td th:text="${#temporals.format(i.dueDate, 'dd/MM/yyyy')}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(i.status)}" th:text="${i.status}"></span></td>
          <td class="text-end">
            <form th:if="${i.status.name() == 'OPEN'}" th:action="@{/admin/invoices/{id}/pay(id=${i.id})}"
                  method="post" class="d-flex gap-1 justify-content-end">
              <select name="paymentMethod" class="form-select form-select-sm" style="width: auto;">
                <option value="pix">Pix</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="cartão">Cartão</option>
                <option value="boleto">Boleto</option>
                <option value="transferência">Transferência</option>
              </select>
              <button type="submit" class="btn btn-sm btn-primary">Registrar pagamento</button>
            </form>
          </td>
        </tr>
        <tr th:if="${invoices.empty}"><td colspan="6" class="text-center text-muted py-4">Nenhuma fatura gerada ainda.</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="mt-3" th:if="${invoices.totalPages > 1}">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, invoices.totalPages - 1)}"
          th:classappend="${i == invoices.number} ? 'active'">
        <a class="page-link" th:href="@{/admin/invoices(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
