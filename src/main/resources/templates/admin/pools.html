<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piscinas · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Piscinas</h1>
    <a class="btn btn-primary" th:href="@{/admin/pools/new}">Nova piscina</a>
  </div>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Nome</th><th>Raias</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${pools.content}">
          <td th:text="${p.name}"></td>
          <td th:text="${p.totalLanes}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(p.status)}" th:text="${p.status}"></span></td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/pools/{id}/edit(id=${p.id})}">Editar</a>
            <form th:action="@{/admin/pools/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Remover esta piscina?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
            </form>
          </td>
        </tr>
        <tr th:if="${pools.empty}"><td colspan="4" class="text-center text-muted py-4">Nenhuma piscina cadastrada.</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="mt-3" th:if="${pools.totalPages > 1}">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, pools.totalPages - 1)}"
          th:classappend="${i == pools.number} ? 'active'">
        <a class="page-link" th:href="@{/admin/pools(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
