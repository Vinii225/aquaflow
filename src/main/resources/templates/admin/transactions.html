<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caixa · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <h1 class="h4 mb-3">Livro-caixa</h1>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Forma</th><th>Valor</th></tr>
      </thead>
      <tbody>
        <tr th:each="t : ${transactions.content}">
          <td th:text="${#temporals.format(t.paidAt, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${t.type}"></td>
          <td th:text="${t.category}"></td>
          <td th:text="${t.paymentMethod}"></td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(t.amount, 1, 2)}"></td>
        </tr>
        <tr th:if="${transactions.empty}"><td colspan="5" class="text-center text-muted py-4">Nenhum lançamento.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
