<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Usuários da escola</h1>
    <a class="btn btn-primary" th:href="@{/admin/users/new}">Novo usuário</a>
  </div>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="tu : ${tenantUsers}">
          <td th:text="${tu.user.name}"></td>
          <td th:text="${tu.user.email}"></td>
          <td th:text="${tu.role}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(tu.status)}" th:text="${tu.status}"></span></td>
          <td class="text-end">
            <form th:action="@{/admin/users/{id}/toggle-status(id=${tu.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-secondary"
                      th:text="${tu.status.name() == 'ACTIVE'} ? 'Bloquear' : 'Reativar'"></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tenantUsers)}"><td colspan="5" class="text-center text-muted py-4">Nenhum usuário cadastrado.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
