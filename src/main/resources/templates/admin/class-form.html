<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Turma', null)}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="conteudo" tabindex="-1" class="container" style="max-width: 560px;">
  <div class="card card-aquaflow p-4">
    <h1 class="h4 mb-3" th:text="${swimClass.id} ? 'Editar turma' : 'Nova turma'">Turma</h1>

    <form th:action="@{/admin/classes}" th:object="${swimClass}" method="post">
      <input type="hidden" th:field="*{id}">

      <div class="mb-3">
        <label class="form-label" for="name">Nome</label>
        <input type="text" class="form-control" id="name" th:field="*{name}"
               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="pool">Piscina</label>
        <select class="form-select" id="pool" th:field="*{pool}"
                th:classappend="${#fields.hasErrors('pool')} ? 'is-invalid'">
          <option th:each="p : ${pools}" th:value="${p.id}" th:text="${p.name}"></option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('pool')}" th:errors="*{pool}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="level">Nível</label>
        <input type="text" class="form-control" id="level" th:field="*{level}" placeholder="Ex.: iniciante">
      </div>

      <div class="mb-3">
        <label class="form-label" for="maxCapacity">Capacidade máxima</label>
        <input type="number" min="1" class="form-control" id="maxCapacity" th:field="*{maxCapacity}"
               th:classappend="${#fields.hasErrors('maxCapacity')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" th:field="*{status}">
          <option value="ACTIVE">Ativa</option>
          <option value="INACTIVE">Inativa</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/classes}">Cancelar</a>
      </div>
    </form>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
