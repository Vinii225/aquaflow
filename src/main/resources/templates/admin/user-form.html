<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo usuário · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container" style="max-width: 480px;">
  <div class="card card-aquaflow p-4">
    <h1 class="h4 mb-3">Novo usuário</h1>

    <form th:action="@{/admin/users}" th:object="${staffForm}" method="post">
      <div class="mb-3">
        <label class="form-label" for="name">Nome</label>
        <input type="text" class="form-control" id="name" th:field="*{name}"
               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" class="form-control" id="email" th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Senha provisória</label>
        <input type="password" class="form-control" id="password" th:field="*{password}"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="role">Papel</label>
        <select class="form-select" id="role" th:field="*{role}">
          <option value="SCHOOL_ADMIN">Administrador</option>
          <option value="TEACHER">Professor</option>
          <option value="STUDENT">Aluno</option>
          <option value="GUARDIAN">Responsável</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Cadastrar</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancelar</a>
      </div>
    </form>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
