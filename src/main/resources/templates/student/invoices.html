<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas faturas · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <h1 class="h4 mb-3">Minhas faturas</h1>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Referência</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr th:each="i : ${invoices}">
          <td th:text="${#temporals.format(i.referenceMonth, 'MM/yyyy')}"></td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(i.amount, 1, 2)}"></td>
          <td th:text="${#temporals.format(i.dueDate, 'dd/MM/yyyy')}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(i.status)}" th:text="${i.status}"></span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="4" class="text-center text-muted py-4">Nenhuma fatura ainda.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
