<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Minhas faturas', null)}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="conteudo" tabindex="-1" class="container">
  <h1 class="h4 mb-3">Minhas faturas</h1>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Referência</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr th:each="i : ${invoices}">
          <td th:text="${#temporals.format(i.referenceMonth, 'MM/yyyy')}"></td>
          <td th:text="'R$ ' + ${#numbers.formatDecimal(i.amount, 1, 2)}"></td>
          <td th:text="${#temporals.format(i.dueDate, 'dd/MM/yyyy')}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(i.status)}" th:text="${i.status.label}"></span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="4" class="text-center text-muted py-4">Nenhuma fatura ainda.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
