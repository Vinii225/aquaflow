<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas reservas · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <h1 class="h4 mb-3">Minhas reservas</h1>

  <div class="table-responsive card-aquaflow p-3">
    <table class="table table-aquaflow align-middle mb-0">
      <thead>
        <tr><th>Data</th><th>Turma</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="b : ${bookings}">
          <td th:text="${#temporals.format(b.classSession.date, 'dd/MM/yyyy')}"></td>
          <td th:text="${b.classSession.swimClass.name}"></td>
          <td><span class="badge" th:classappend="'badge-status-' + ${#strings.toLowerCase(b.status)}" th:text="${b.status}"></span></td>
          <td class="text-end">
            <form th:if="${b.status.name() == 'CONFIRMED'}" th:action="@{/student/bookings/{id}/cancel(id=${b.id})}"
                  method="post" onsubmit="return confirm('Cancelar esta reserva?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="4" class="text-center text-muted py-4">Você ainda não tem reservas.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
