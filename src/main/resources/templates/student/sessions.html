<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aulas disponíveis · AquaFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <h1 class="h4 mb-3">Aulas disponíveis</h1>

  <div class="row g-3">
    <div class="col-md-6" th:each="view : ${sessions}">
      <div class="card card-aquaflow p-3 h-100">
        <h2 class="h6 mb-1" th:text="${view.session.swimClass.name}"></h2>
        <p class="text-muted mb-2">
          <span th:text="${#temporals.format(view.session.date, 'dd/MM/yyyy')}"></span> ·
          <span th:text="${#temporals.format(view.session.startTime, 'HH:mm')} + ' às ' + ${#temporals.format(view.session.endTime, 'HH:mm')}"></span>
        </p>
        <p class="mb-2">
          <span th:text="${view.confirmed} + '/' + ${view.session.limitStudents} + ' vagas ocupadas'"></span>
        </p>

        <form th:action="@{/student/sessions/{id}/book(id=${view.session.id})}" method="post">
          <button type="submit" class="btn btn-primary w-100"
                  th:disabled="${view.full or view.alreadyBooked}"
                  th:text="${view.alreadyBooked} ? 'Já reservado' : (${view.full} ? 'Sem vagas' : 'Reservar vaga')">
          </button>
        </form>
      </div>
    </div>
    <div class="col-12" th:if="${#lists.isEmpty(sessions)}">
      <p class="text-muted text-center py-4">Nenhuma aula disponível no momento.</p>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
