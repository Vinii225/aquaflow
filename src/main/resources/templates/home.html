<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${schoolName} + ' · Início'">AquaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/aquaflow.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container pb-5">
  <section class="hero-aquaflow p-5 mb-5">
    <h1 class="display-5 fw-bold" th:text="${schoolName}">AquaFlow Escola de Natação</h1>
    <p class="lead mb-4">Aulas de natação para todas as idades, em um ambiente seguro e acolhedor.</p>
    <a class="btn btn-accent btn-lg" th:href="@{/register}">Matricule-se</a>
  </section>

  <section class="row g-3 gallery-aquaflow mb-5">
    <div class="col-md-4">
      <img th:src="@{/img/gallery-swimmer.jpg}" alt="Aluno nadando crawl em raia da piscina">
    </div>
    <div class="col-md-4">
      <img th:src="@{/img/gallery-dive.jpg}" alt="Aluno mergulhando na piscina">
    </div>
    <div class="col-md-4">
      <img th:src="@{/img/gallery-pool.jpg}" alt="Piscina da escola">
    </div>
  </section>

  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <div class="card card-aquaflow h-100 p-4">
        <h2 class="h5">Horários de funcionamento</h2>
        <ul class="list-unstyled mb-0" th:if="${not #lists.isEmpty(schedules)}">
          <li th:each="s : ${schedules}" class="mb-1">
            <strong th:text="${dayNames[s.dayOfWeek]}">Segunda</strong>
            <span th:text="${s.swimClass.name}"></span> —
            <span th:text="${#temporals.format(s.startTime, 'HH:mm')} + ' às ' + ${#temporals.format(s.endTime, 'HH:mm')}"></span>
          </li>
        </ul>
        <p class="text-muted mb-0" th:if="${#lists.isEmpty(schedules)}">Grade ainda não cadastrada.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-aquaflow h-100 p-4">
        <h2 class="h5">Professores</h2>
        <ul class="list-unstyled mb-0" th:if="${not #lists.isEmpty(teachers)}">
          <li th:each="t : ${teachers}" th:text="${t.name}">Nome</li>
        </ul>
        <p class="text-muted mb-0" th:if="${#lists.isEmpty(teachers)}">Nenhum professor cadastrado.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-aquaflow h-100 p-4">
        <h2 class="h5">Endereço e contato</h2>
        <p class="mb-1" th:text="${schoolAddress}"></p>
        <p class="mb-0" th:text="${schoolPhone}"></p>
      </div>
    </div>
  </div>

  <div class="row g-4 mb-5" th:if="${not #lists.isEmpty(pools)}">
    <div class="col-12">
      <h2 class="h5">Nossas piscinas</h2>
    </div>
    <div class="col-md-4" th:each="p : ${pools}">
      <div class="card card-aquaflow h-100 p-4">
        <h3 class="h6" th:text="${p.name}"></h3>
        <p class="text-muted mb-0" th:text="${p.totalLanes} + ' raias'"></p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
